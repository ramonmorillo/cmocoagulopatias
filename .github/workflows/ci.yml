name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Pruebas, build y E2E
    # Ubuntu 24.04 fijado: Playwright 1.56 no soporta aún ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dependencias
        run: npm ci

      - name: Pruebas unitarias
        run: npm test

      - name: Build
        run: npm run build --if-present

      # Playwright y axe-core se instalan fuera del proyecto: `npm install --no-save` sobre un árbol de `npm ci` falla en este repo.
      - name: Instalar Playwright (Chromium) y axe-core
        run: |
          mkdir -p "$RUNNER_TEMP/e2e-tools"
          npm install --prefix "$RUNNER_TEMP/e2e-tools" --no-package-lock playwright@1.56.1 axe-core@4.10.2
          "$RUNNER_TEMP/e2e-tools/node_modules/.bin/playwright" install --with-deps chromium

      - name: Pruebas E2E (con auditoría WCAG A/AA)
        env:
          NODE_PATH: ${{ runner.temp }}/e2e-tools/node_modules
          AXE_PATH: ${{ runner.temp }}/e2e-tools/node_modules/axe-core/axe.min.js
        run: npm run test:e2e
